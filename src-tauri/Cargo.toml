[package]
name = "goslicer"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
psd = "0.3"
image = "0.25"
base64 = "0.22"
tempfile = "3"
open = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
